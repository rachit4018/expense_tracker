server {
    listen 80;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://3.96.166.110/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /csrf/ {
        proxy_pass http://3.96.166.110/csrf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}